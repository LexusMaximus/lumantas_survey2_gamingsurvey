<!DOCTYPE html>
<html>
	<head>
		<title>Register</title>
		<link rel="stylesheet" href="styles.css">
	</head>

	<body>

		<div class="form-box">
			user
			<input id='user' type='text'>
			password
			<input id='pass' type='password'>
			confirm password
			<input id='verifyPass' type='password'>

			<button class="btn-right" type="button" onclick="clickButton( document.getElementById('user').value ,document.getElementById('pass').value, document.getElementById('verifyPass').value )">register</button>
		</div>

		<script>




		const clickButton = (a,b, c) =>{

			if (b !== c) {
				alert('passwords do not match');
				return;
			}

			const postData = {
				name:a,
				password:b
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/users',data);
					const body = await response.json();
					console.log(response)
					if (body.message) {
						document.location.href = 'login.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
