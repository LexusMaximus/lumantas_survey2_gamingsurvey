<!DOCTYPE html>
<html>
	<head>
		<title>Login</title>
		<link rel="stylesheet" href="styles.css">
	</head>

	<body>

		<div class="form-box">
			username
			<input id='user' type='text'>
			password
			<input id='pass' type='password'>

			<div id="row">
				<button type="button" onclick="document.location.href = 'register.html'">register</button>
				<button type="button" onclick="clickButton( document.getElementById('user').value ,document.getElementById('pass').value )">login</button>
			</div>
		</div>

		<script>




		const clickButton = (a,b) =>{

			const postData = {
				name:a,
				password:b
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					const body = await response.json();
					console.log(response)
					if (body.status =='success') {
						document.location.href = 'main.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
